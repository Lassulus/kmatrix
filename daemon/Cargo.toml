[package]
name = "kmatrixd"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Already in the tree under rusqlite and rand; made direct for flock, which is
# how one daemon per data directory is enforced.
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["rustls"] }
# `insecure-pk-encryption` gates vodozemac's PkDecryption, which IS
# m.megolm_backup.v1.curve25519-aes-sha2 -- there is no other way to read a
# Matrix server-side key backup. Same crate, same version, no new deps.
#
# The "insecure" label is about the spec'd algorithm, not the implementation:
# it provides no authentication of the ciphertext, and encrypting requires
# only the public backup key the homeserver already stores. A hostile server
# can therefore forge backup entries. Sessions imported from backup are lower
# provenance than keys received over Olm; we still validate the recovery key
# against the advertised public key so a server cannot swap the whole backup.
vodozemac = { version = "0.10", features = [
    "insecure-pk-encryption",
    # `low-level-api` exposes vodozemac::hazmat::{Cipher, Mac} (AES-256-CBC +
    # HMAC-SHA256 with HKDF key derivation). Used to encrypt the on-device
    # store, whose database lives on the USB-exported partition while its key
    # does not. Reusing a vetted primitive beats hand-rolling one.
    "low-level-api",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
